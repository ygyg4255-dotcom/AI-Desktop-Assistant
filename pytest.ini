[pytest]
# Root-level test_app.py / test_chat_ui.py / test_step3_final.py /
# test_ui_integration.py are legacy manual GUI scripts for the deprecated
# PySide6 UI, not pytest suites, so collection is limited to these paths.
testpaths = tests test_agent.py
# Never write .pytest_cache/ into the OneDrive-synced project folder.
addopts = -p no:cacheprovider
